[project]
name = "jev-as-a-judge"
version = "0.1.0"
description = "Jev-as-a-Judge evaluation on LangSmith"
requires-python = ">=3.11"
dependencies = [
    "langsmith>=0.14.14",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "typesafe-sdk>=0.7.5",
]

[build-system]
requires = ["uv_build>=0.11.15,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["llm_judge", "clients"]
module-root = ""
